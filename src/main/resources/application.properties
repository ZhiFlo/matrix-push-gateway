# 推送服务端口（开放给 IM 服务调用）
server.port=8085

# Admin 后台管理端口
admin.server.port=8086
logging.level.root=info
logging.file=push.log

# Database Configuration
# Development/test default: H2 embedded.
spring.datasource.url=${PUSH_DB_URL:jdbc:h2:file:./data/push_admin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${PUSH_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${PUSH_DB_USERNAME:sa}
spring.datasource.password=${PUSH_DB_PASSWORD:}
spring.jpa.database-platform=${PUSH_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${PUSH_DB_DDL_AUTO:update}

# Matrix Push Gateway adapter. Vendor tokens are encoded in Matrix pushkeys as
# <provider>:<token>, for example hms:..., xiaomi:..., honor:..., fcm:....
matrix.push.package-name=${MATRIX_PUSH_PACKAGE_NAME:io.element.android.x}
matrix.push.title=${MATRIX_PUSH_TITLE:Element}
matrix.push.body=${MATRIX_PUSH_BODY:You have a new message}

