# Production storage uses the existing PostgreSQL platform. Keep this service
# isolated with its own database and role, for example database "matrix_push".
spring.datasource.url=${PUSH_DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PUSH_DB_USERNAME}
spring.datasource.password=${PUSH_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${PUSH_DB_DDL_AUTO:update}
