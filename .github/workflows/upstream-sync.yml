name: Matrix Push Gateway Upstream Sync

on:
  push:
    branches:
      - master
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: matrix-push-upstream-sync
  cancel-in-progress: false

jobs:
  sync-build:
    if: github.repository == 'ZhiFlo/matrix-push-gateway'
    runs-on: [self-hosted, linux, x64, push-build]
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "zhiflo-upstream-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge upstream push_server
        id: merge
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -u
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/wildfirechat/push_server.git
          git fetch --prune upstream master

          before="$(git rev-parse HEAD)"
          if git merge --no-edit upstream/master; then
            after="$(git rev-parse HEAD)"
            if [ "$before" != "$after" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ',' -)"
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Report upstream merge conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[upstream-sync] push_server merge conflict";
            const conflicts = process.env.CONFLICTS || "(unable to enumerate)";
            const body = [
              "Automatic merge from `wildfirechat/push_server:master` failed.",
              "",
              "Conflicting paths:",
              "```",
              conflicts.split(",").join("\n"),
              "```",
              "",
              "The fork branch was left unchanged."
            ].join("\n");
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}

      - name: Stop on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and test gateway
        shell: bash
        run: |
          test -x ./mvnw || chmod +x ./mvnw
          ./mvnw -B clean package

      - name: Capture build metadata
        id: meta
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          find target -maxdepth 1 -type f -name '*.jar' -print -exec sha256sum {} \;

      - name: Push verified upstream merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Upload gateway JAR
        uses: actions/upload-artifact@v4
        with:
          name: matrix-push-gateway-${{ steps.meta.outputs.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
