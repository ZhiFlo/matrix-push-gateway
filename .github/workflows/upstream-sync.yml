name: Matrix Push Gateway Upstream Sync

on:
  push:
    branches:
      - master
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: matrix-push-upstream-sync
  cancel-in-progress: true

jobs:
  sync-build:
    if: github.repository == 'ZhiFlo/matrix-push-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "zhiflo-upstream-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge upstream push_server
        id: merge
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -u
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/wildfirechat/push_server.git
          git fetch --prune upstream master
          before="$(git rev-parse HEAD)"
          if git merge --no-edit upstream/master; then
            after="$(git rev-parse HEAD)"
            if [ "$before" != "$after" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ',' -)"
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Report upstream merge conflict
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        run: |
          echo "::error title=push_server upstream merge conflict::${{ steps.merge.outputs.conflicts }}"
          {
            echo "## push_server upstream merge conflict"
            echo
            echo "Automatic merge from wildfirechat/push_server:master failed."
            echo
            echo "Conflicting paths:"
            echo "${{ steps.merge.outputs.conflicts }}" | tr ',' '\n'
            echo
            echo "The fork branch was left unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Set up JDK 8
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and test gateway
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          mvn -B clean package

      - name: Capture build metadata
        id: meta
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          find target -maxdepth 1 -type f -name '*.jar' -print -exec sha256sum {} \;

      - name: Set up Docker Buildx
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zhiflo/matrix-push-gateway:${{ steps.meta.outputs.sha }}
            ghcr.io/zhiflo/matrix-push-gateway:master

      - name: Push verified upstream merge
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          SYNC_SSH_KEY: ${{ secrets.SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SYNC_SSH_KEY" || { echo "SYNC_SSH_KEY secret is missing"; exit 1; }
          key_dir="$RUNNER_TEMP/zhiflo-sync-ssh"
          install -d -m 700 "$key_dir"
          printf '%s\n' "$SYNC_SSH_KEY" > "$key_dir/id_ed25519"
          chmod 600 "$key_dir/id_ed25519"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$key_dir/known_hosts"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          GIT_SSH_COMMAND="ssh -i $key_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts" git push origin HEAD:master

      - name: Upload gateway JAR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-push-gateway-${{ steps.meta.outputs.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
